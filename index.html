<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#313338">

    <link rel="stylesheet" href="style.css?v=16">
    <link rel="manifest" href="manifest.json">

    <title>Knowledge Discord</title>
</head>
<body>
    <nav id="mobileStageNav" aria-label="Mobile sections">
        <button type="button" data-stage-target="servers">Servers</button>
        <button type="button" data-stage-target="sidebar">Channels</button>
        <button type="button" data-stage-target="chat">Chat</button>
    </nav>

    <main id="app">
        <aside id="servers"></aside>

        <aside id="sidebar">
            <header class="sidebarHeader">
                <div>
                    <p class="eyebrow">Private workspace</p>
                    <h1>Knowledge</h1>
                </div>
                <button id="newServerBtn" type="button">+</button>
            </header>

            <div class="sidebarTools">
                <button id="settingsBtn" type="button">Settings</button>
                <button id="newCategoryBtn" type="button">Folder</button>
                <button id="newChannelBtn" type="button">Channel</button>
                <button id="randomChannelBtn" type="button">Random channel</button>
            </div>

            <nav id="channels"></nav>

            <section id="privacyPanel">
                <p>Local-only single-user storage. Notes and pasted images stay in this browser on this device.</p>
                <p>External embeds may contact their original host when displayed.</p>
                <p id="storageInfo">Storage: checking</p>

                <label class="viewToggle">
                    <input id="photoGridToggle" type="checkbox">
                    <span>Photo grid view</span>
                </label>

                <label class="viewToggle">
                    <input id="embedControlsToggle" type="checkbox">
                    <span>Discord-style media controls</span>
                </label>

                <div class="photoArrayControls">
                    <label>
                        <span>Random photo array</span>
                        <input id="randomPhotoCount" type="number" min="1" max="500" value="9">
                    </label>
                    <button id="randomPhotoArrayBtn" type="button">Create array</button>
                </div>

                <div class="randomRange">
                    <label>
                        <span>Min</span>
                        <input id="randomMin" type="number">
                    </label>
                    <label>
                        <span>Max</span>
                        <input id="randomMax" type="number">
                    </label>
                    <button id="randomNumberBtn" type="button">Roll</button>
                    <output id="randomNumberResult"></output>
                </div>

                <div class="savedRandomizer">
                    <label>
                        <span>Saved randomizer</span>
                        <textarea id="savedRandomInput" rows="3" placeholder="Add one option per line"></textarea>
                    </label>
                    <div class="savedRandomActions">
                        <button id="saveRandomTextBtn" type="button">Save text</button>
                        <button id="randomTextBtn" type="button">Pick text</button>
                    </div>
                    <output id="randomTextResult"></output>
                    <div id="savedRandomList"></div>
                </div>
            </section>
        </aside>

        <section id="chat">
            <header id="topbar">
                <div>
                    <h2 id="activeTitle">Loading</h2>
                    <p id="activeMeta"></p>
                </div>

                <div class="topActions">
                    <button id="randomMessageBtn" type="button">Random note</button>
                    <button id="saveRandomArrayBtn" type="button" hidden>Save array</button>
                    <button id="lockWorkspaceBtn" type="button">Lock</button>
                    <button id="deleteChannelBtn" class="dangerAction" type="button">Delete channel</button>

                    <label class="searchWrap">
                        <span>Search</span>
                        <input id="searchInput" type="search" placeholder="Search notes, images, or #tags">
                    </label>
                </div>
            </header>

            <div id="messages"></div>

            <form id="input-bar" onsubmit="return false;">
                <div id="attachmentPreview"></div>
                <textarea id="noteInput" rows="1" placeholder="Write a note, paste an image, or add #tags"></textarea>
                <input id="imageInput" type="file" accept="image/*" multiple hidden>
                <button id="attachImageBtn" type="button">Image</button>
                <button id="sendBtn" type="button">Send</button>
            </form>
        </section>
    </main>

    <section id="lockScreen" class="lockScreen">
        <div class="lockCard">
            <p class="eyebrow">Private workspace</p>
            <h2>Locked</h2>
            <p>Enter your PIN to open channels and local photos.</p>

            <form id="unlockForm">
                <input id="channelPinInput" type="password" inputmode="numeric" placeholder="PIN">
                <button type="submit">Unlock</button>
            </form>

            <p id="unlockError" class="unlockError"></p>
        </div>
    </section>

    <script src="db.js?v=16" defer></script>
    <script src="app.js?v=16" defer></script>
</body>
</html>
